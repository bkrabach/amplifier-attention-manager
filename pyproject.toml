[project]
name = "amplifier-attention-manager"
version = "0.1.0"
description = "Attention manager: packet queue, escalation bus, and supervisor for Amplifier worker sessions"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
attention-manager = "attention_manager.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attention_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.pyright]
extraPaths = ["src", "modules/tool-request-decision", "modules/hooks-packet-approval"]
