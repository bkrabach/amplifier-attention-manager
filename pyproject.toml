[project]
name = "amplifier-attention-manager"
version = "0.1.0"
description = "Attention manager: packet queue, escalation bus, and supervisor for Amplifier worker sessions"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
attention-manager = "attention_manager.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
# The core package is stdlib-only by design. The attractor work-unit runner
# (attention-manager workunit run) needs the shipped pipeline engine; all
# imports of it are lazy, so the base install never pulls this in.
attractor = [
    "amplifier-module-loop-pipeline @ git+https://github.com/microsoft/amplifier-bundle-attractor@main#subdirectory=modules/loop-pipeline",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attention_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.pyright]
extraPaths = ["src", "modules/tool-request-decision", "modules/hooks-packet-approval"]
