[project]
name = "amplifier-module-hooks-packet-approval"
version = "0.1.0"
description = "Packet-writing ApprovalProvider: permission gates serialize to the attention queue instead of blocking a console"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []   # amplifier-core is a peer dependency — do NOT declare it here

[project.entry-points."amplifier.modules"]
hooks-packet-approval = "amplifier_module_hooks_packet_approval:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_hooks_packet_approval"]
